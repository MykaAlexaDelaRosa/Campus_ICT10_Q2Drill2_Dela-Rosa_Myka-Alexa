
<!DOCTYPE html>
<html>
<head>
    <title>ICT Club</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.1.1/core.js"></script>

    <style>
        body {
            background-color: pink;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
        }

        .box {
            background-color: rgb(255, 251, 182);
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        h1, h3, h4 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: hotpink;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
            border: 1px solid hotpink;
            border-radius: 5px;
            font-family: 'Quicksand', sans-serif;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: hotpink;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <!-- Main box -->
    <div class="box">
        <h1>ICT Club</h1>

        <p>Add a new club member!</p>

        <!-- Name input boxes -->
        <input id="first" placeholder="First Name">
        <input id="last" placeholder="Last Name">

        <!-- Add member button -->
        <button py-click="add_member">Add Member</button>

        <!-- Display members and total -->
        <div id="result">
            <p>The member list will appear here.</p>
        </div>
    </div>

    <!-- Connect Python code -->
    <script type="py" src="main.py"></script>

</body>
</html>
